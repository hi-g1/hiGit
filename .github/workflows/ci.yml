name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 아무 커밋에서나 Windows 시험판을 받으려고 수동 실행을 연다.
  workflow_dispatch:

# 워크플로 토큰은 읽기만 한다(D-038). 더 필요한 작업만 따로 준다.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 러너 디스크가 차서 링커가 죽는 일을 막는다(debug 정보가 target의 대부분). 로컬 빌드는 그대로다.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  deny:
    name: cargo-deny
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 취약점, 라이선스, 출처, 중복을 검사한다(D-038). 설정은 src-tauri/deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check

  git-min:
    # GitHub 러너의 git은 최신이라, Ubuntu 22.04 기본 git(2.34.1)으로 Rust 테스트를 따로 돌린다.
    # --end-of-options 버전 표, 2.38 미만 겹침 검사(D-050)가 여기서 실제로 돈다.
    name: ubuntu-22.04 기본 git
    runs-on: ubuntu-22.04
    container: ubuntu:22.04
    steps:
      - name: 시스템 패키지
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git build-essential curl ca-certificates pkg-config
          git --version

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust 도구 (rust-toolchain.toml)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: git-min

      - name: cargo test (app 제외)
        working-directory: src-tauri
        run: cargo test --workspace --exclude app

  build-and-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ubuntu 러너 디스크 비우기
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Ubuntu 시스템 패키지
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev build-essential libxdo-dev libayatana-appindicator3-dev
          # git 오류가 한국어 환경에서도 영어로 나오는지 실제로 시험하려고 한국어 번역·로케일을 깐다(D-021).
          sudo apt-get install -y language-pack-ko

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Rust 도구 (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: 도구 버전
        run: |
          git --version
          node --version
          pnpm --version
          rustc --version

      - run: pnpm install --frozen-lockfile

      - name: 프론트 린트
        run: pnpm lint

      - name: 프론트 타입 검사
        run: pnpm typecheck

      - name: 프론트 테스트
        run: pnpm test

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --workspace

      # 새 의존성이 THIRD_PARTY_LICENSES.txt에 빠지면 실패한다(D-220). 두 OS 대상을 한 번에 보므로 Ubuntu에서만.
      - name: 서드파티 고지가 최신인지
        if: runner.os == 'Linux'
        run: node scripts/notices.mjs --check

      - name: 바인딩이 최신인지
        working-directory: src-tauri
        run: |
          cargo run -p app --example gen-bindings
          git diff --exit-code -- ../src/lib

      - name: 프론트 빌드
        run: pnpm build

      - name: 앱 빌드 (설치 파일 없이)
        run: pnpm tauri build --no-bundle

      - name: Windows 실행 파일이 VC++ 런타임 없이 뜨는지
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $deps = & $dumpbin.FullName /dependents src-tauri\target\release\higit.exe
          $deps
          if ($deps -match 'VCRUNTIME\d+\.dll|MSVCP\d+\.dll') { throw "higit.exe가 VC++ 런타임 DLL에 의존합니다 (crt-static 확인)" }

      - name: Windows 결과물 모으기
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item src-tauri\target\release\higit.exe artifact\
          # 글꼴 OFL은 배포할 때 라이선스 원문을 함께 넣어야 한다(D-014).
          Copy-Item THIRD_PARTY_NOTICES.md artifact\
          Copy-Item THIRD_PARTY_LICENSES.txt artifact\
          Copy-Item packaging\windows\README.txt artifact\

      - name: Windows 결과물 올리기
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: higit-windows-x64-${{ github.sha }}
          path: artifact/
          retention-days: 14
          if-no-files-found: error
