name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 아무 커밋에서나 Windows 시험판을 받으려고 수동 실행을 연다.
  workflow_dispatch:

# 워크플로 토큰은 읽기만 한다(D-038). 더 필요한 작업만 따로 준다.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ubuntu 시스템 패키지
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev build-essential libxdo-dev libayatana-appindicator3-dev
          # git 오류가 한국어 환경에서도 영어로 나오는지 실제로 시험하려고 한국어 번역·로케일을 깐다(D-021).
          sudo apt-get install -y language-pack-ko

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Rust 도구 (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: 도구 버전
        run: |
          git --version
          node --version
          pnpm --version
          rustc --version

      - run: pnpm install --frozen-lockfile

      - name: 프론트 린트
        run: pnpm lint

      - name: 프론트 타입 검사
        run: pnpm typecheck

      - name: 프론트 테스트
        run: pnpm test

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --workspace

      - name: 바인딩이 최신인지
        working-directory: src-tauri
        run: |
          cargo run -p app --bin gen-bindings
          git diff --exit-code -- ../src/lib

      - name: 프론트 빌드
        run: pnpm build

      - name: 앱 빌드 (설치 파일 없이)
        run: pnpm tauri build --no-bundle

      - name: Windows 실행 파일이 VC++ 런타임 없이 뜨는지
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $deps = & $dumpbin.FullName /dependents src-tauri\target\release\higit.exe
          $deps
          if ($deps -match 'VCRUNTIME\d+\.dll|MSVCP\d+\.dll') { throw "higit.exe가 VC++ 런타임 DLL에 의존합니다 (crt-static 확인)" }

      - name: Windows 결과물 모으기
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item src-tauri\target\release\higit.exe artifact\
          # 글꼴 OFL은 배포할 때 라이선스 원문을 함께 넣어야 한다(D-014).
          Copy-Item THIRD_PARTY_NOTICES.md artifact\
          Copy-Item packaging\windows\README.txt artifact\

      - name: Windows 결과물 올리기
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: higit-windows-x64-${{ github.sha }}
          path: artifact/
          retention-days: 14
          if-no-files-found: error
