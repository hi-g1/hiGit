[package]
name = "app"
description = "hiGit: Git을 모르는 사람도 쉽게 쓰는 데스크톱 Git 앱"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# 바이너리가 둘(higit, gen-bindings)이라 tauri dev가 띄울 것을 정한다.
default-run = "higit"

[lib]
name = "app_lib"

[[bin]]
name = "higit"
path = "src/main.rs"

# 화면용 TS 바인딩과 액션 메타 생성: cargo run -p app --bin gen-bindings
[[bin]]
name = "gen-bindings"
path = "src/bin/gen-bindings.rs"

[lints]
workspace = true

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
higit-core = { path = "crates/core" }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-window-state = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
tauri-specta = { workspace = true }

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.lints.clippy]
# 테스트 밖에서 패닉으로 앱을 죽이지 않는다(D-038). 테스트는 clippy.toml에서 허용한다.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[workspace.package]
version = "0.1.0"
license = "MIT"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
tauri = { version = "2.12", features = [] }
tauri-build = { version = "2.7", features = [] }
tauri-plugin-dialog = "2.8"
# 외부 링크를 Rust에서만 연다. 웹뷰에는 opener 권한을 주지 않는다(D-037).
tauri-plugin-opener = "2"
# 이미 켜진 앱이 있으면 두 번째 실행의 인자를 그 창으로 넘긴다(D-213). Windows는 창 메시지, Linux는 D-Bus.
tauri-plugin-single-instance = "2.5"
# 창 크기·위치 기억(D-217). Rust에서만 쓰고 웹뷰 권한은 열지 않는다.
tauri-plugin-window-state = "2.5"
which = "8.0"
dirs = "7.0"
dunce = "1.0"
thiserror = "2.0"
tempfile = "3.27"
serde_json = "1.0"
notify = "8.2"
notify-debouncer-full = "0.7"
ignore = "0.4"
serde = { version = "1.0", features = ["derive"] }
# 반복 4(D-110): GitHub API용 HTTP(블로킹, rustls + OS 인증서 확인), 토큰 감싸기, OS 키체인.
# ureq의 `rustls` 기능은 webpki-roots 인증서 묶음까지 끌고 오므로 provider 없는 쪽을 쓰고
# 암호 구현(`ring`)은 rustls에서 직접 고른다. 인증서는 OS 저장소로 확인한다.
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
secrecy = "0.10"
percent-encoding = "2.3"
keyring-core = "1.0"
windows-native-keyring-store = { version = "1.1", default-features = false }
zbus-secret-service-keyring-store = { version = "1.0", features = ["rt-async-io-crypto-rust"] }
# 바인딩 생성(D-019): RC라서 정확한 버전으로 고정한다. 세 크레이트는 함께 올린다.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
