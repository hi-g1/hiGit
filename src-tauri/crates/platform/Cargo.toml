[package]
name = "platform"
description = "OS별 코드: git 찾기, 경로 정규화, 우클릭 메뉴, 키체인"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
which = { workspace = true }
dunce = { workspace = true }
dirs = { workspace = true }
keyring-core = { workspace = true }
secrecy = { workspace = true }

# 프로세스 그룹째 끝내기(D-041). unsafe 없는 API라 platform의 forbid(unsafe_code)를 지킨다.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

# OS 키체인 저장소(D-110). Windows 자격 증명 관리자, Linux Secret Service(순수 Rust).
[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
