.hint{display:flex;flex-direction:column;gap:6px;align-items:flex-start;white-space:nowrap}
.work{flex:1;display:grid;grid-template-columns:340px 1fr;min-height:0;background:var(--surface)}
.files{border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.fh{display:flex;align-items:center;gap:10px;height:40px;padding:0 18px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted)}
.fl{display:flex;align-items:center;gap:12px;height:48px;padding:0 18px;border-bottom:1px solid var(--border)}

.toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--surface);border-radius:8px;padding:11px 16px;display:flex;gap:20px;align-items:center;font-size:13px;z-index:8;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.toast b{font-weight:600}
.toast .k{font-family:var(--f-mono);font-size:11px;opacity:.7}
.menu{position:absolute;background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.14);z-index:9;display:flex;flex-direction:column;padding:6px 0}
.mi{display:flex;align-items:center;gap:10px;height:34px;padding:0 14px;white-space:nowrap}
.mi .r{margin-left:auto;font-size:12px;color:var(--muted)}
.mi.on{background:var(--sunken)}
.mh{font-size:11px;color:var(--muted);padding:8px 14px 4px}
.msep{height:1px;background:var(--border);margin:6px 0}
